<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1a2b" />
    <title>Endurance Base Club — Cronometragem</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱️</text></svg>" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Endurance" />
    <meta name="description" content="Cronometragem, resultados e histórico dos eventos do Endurance Base Club." />
    <script type="module" crossorigin src="./assets/index-BLqs3S3v.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DbJE9pxf.css">
  </head>
  <body>
    <div id="root">
      <!-- Fica visivel ate o app assumir a tela. Se o JavaScript nao carregar
           (versao velha em cache, rede ruim, navegador antigo), a pessoa ve
           esta tela em vez de uma pagina em branco -- no meio do evento, isso
           e a diferenca entre "recarrega ai" e "perdemos a cronometragem". -->
      <div id="boot">
        <div class="boot-card">
          <div class="boot-logo">⏱️</div>
          <h1>Endurance Base Club</h1>
          <p id="boot-msg">Carregando…</p>
          <div id="boot-acoes" hidden>
            <button onclick="location.reload()">Tentar de novo</button>
            <button id="boot-limpar" class="alt">Limpar e recarregar</button>
            <p class="boot-dica">
              Se continuar assim, feche o app e abra de novo, ou acesse pelo navegador.
            </p>
          </div>
        </div>
      </div>
    </div>
    <style>
      #boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
        font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; background: #0b1a2b; }
      .boot-card { text-align: center; max-width: 340px; }
      .boot-logo { font-size: 54px; }
      #boot h1 { font-size: 22px; margin: 6px 0 4px; color: #f7fbff; }
      #boot p { color: #9bb0c6; font-size: 14px; margin: 0; }
      #boot-acoes { margin-top: 18px; display: flex; flex-direction: column; gap: 8px; }
      #boot button { border: 0; border-radius: 12px; padding: 13px 16px; font-size: 15px;
        font-weight: 700; background: #f2761b; color: #0b1a2b; cursor: pointer; }
      #boot button.alt { background: #16263a; color: #f7fbff; }
      .boot-dica { font-size: 12px; margin-top: 6px !important; }
    </style>
    <script>
      // Sem app na tela depois de 8s, oferece as saidas.
      window.__bootTimer = setTimeout(function () {
        var m = document.getElementById('boot-msg')
        var a = document.getElementById('boot-acoes')
        if (m && a) {
          m.textContent = 'O app está demorando para abrir.'
          a.hidden = false
        }
      }, 8000)
      document.addEventListener('click', function (e) {
        if (!e.target || e.target.id !== 'boot-limpar') return
        var pronto = function () { location.reload() }
        var tarefas = []
        if ('serviceWorker' in navigator) {
          tarefas.push(navigator.serviceWorker.getRegistrations()
            .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister() })) }))
        }
        if (window.caches) {
          tarefas.push(caches.keys().then(function (ks) {
            return Promise.all(ks.map(function (k) { return caches.delete(k) }))
          }))
        }
        Promise.all(tarefas).then(pronto, pronto)
      })
    </script>
  </body>
</html>
