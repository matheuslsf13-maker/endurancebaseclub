<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191513" />
    <title>EnduranceBaseClub</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      var d = location.hash.indexOf('#/c/') === 0 ? 'light' : 'dark'; /* timekeeper link: light by default (sun glare) */
      var theme = d;
      try { var t = localStorage.getItem('ebc.theme'); theme = (t === 'light' || t === 'dark') ? t : d; }
      catch (e) {}
      document.documentElement.dataset.theme = theme;
      /* C-Minor-19: theme-color follows the bootstrapped theme (this fixed value otherwise stayed
         ink even for the timekeeper link, which opens light by default — a light address bar with
         a dark declared color reads wrong on Android). ThemeToggle keeps it in sync afterwards. */
      document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#F4F1EC' : '#191513');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
